<svg xmlns="http://www.w3.org/2000/svg" width="900" height="134" viewBox="0 0 900 134" role="img" aria-label="Tools I use: Python, C, C++, Jupyter, TensorFlow, FastAPI, LLM APIs, HTML, JavaScript, MySQL, OBS Studio.">
<title>Tools I use: Python, C, C++, Jupyter, TensorFlow, FastAPI, LLM APIs, HTML, JavaScript, MySQL, OBS Studio.</title>
<style>
svg{--void:#0B0E24;--surface:#141935;--line:#2A3160;--amber:#F2B441;--violet:#8A7BF0;
  --text:#E6E7F2;--muted:#9AA0C6;--soft:#D3D6E8;
  --display:"Newsreader",Georgia,"Times New Roman",serif;
  --body:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
:where(.fo),:where(.fo) *{box-sizing:border-box;margin:0;padding:0}
.fo{width:100%;height:100%;font-family:var(--body);color:var(--text);-webkit-font-smoothing:antialiased}
em{font-style:normal;color:var(--amber)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes scan{0%{transform:translateX(-120%)}55%,100%{transform:translateX(330%)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.panel{height:100%;display:flex;flex-wrap:wrap;align-content:center;gap:10px;padding:20px 24px;
  border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#171C3D,var(--surface))}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border:1px solid var(--line);
  border-radius:999px;background:rgba(11,14,36,.55);font:12.5px var(--mono);letter-spacing:.03em;
  color:var(--soft);animation:rise .6s ease-out both}
.chip i{width:8px;height:8px;border-radius:50%}
</style>
<foreignObject x="5" y="5" width="890" height="124"><div xmlns="http://www.w3.org/1999/xhtml" class="fo"><div class="panel"><span class="chip" style="animation-delay:0.00s"><i style="background:#3572A5"></i>Python</span><span class="chip" style="animation-delay:0.05s"><i style="background:#A8B9CC"></i>C</span><span class="chip" style="animation-delay:0.10s"><i style="background:#F34B7D"></i>C++</span><span class="chip" style="animation-delay:0.15s"><i style="background:#DA5B0B"></i>Jupyter</span><span class="chip" style="animation-delay:0.20s"><i style="background:#FF6F00"></i>TensorFlow</span><span class="chip" style="animation-delay:0.25s"><i style="background:#009688"></i>FastAPI</span><span class="chip" style="animation-delay:0.30s"><i style="background:#8A7BF0"></i>LLM APIs</span><span class="chip" style="animation-delay:0.35s"><i style="background:#E34C26"></i>HTML</span><span class="chip" style="animation-delay:0.40s"><i style="background:#F1E05A"></i>JavaScript</span><span class="chip" style="animation-delay:0.45s"><i style="background:#4479A1"></i>MySQL</span><span class="chip" style="animation-delay:0.50s"><i style="background:#9AA0C6"></i>OBS Studio</span></div></div></foreignObject>
</svg>
